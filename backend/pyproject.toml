[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "django-tipping"
version = "0.1.0"
description = "Simple Django Application for managing and conducting sports tipping competitions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Blake McIvor" },
]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development",
]
keywords = ["django-tipping", "tipping"]
dependencies = [
    "django==6.0.7",
    "django-stubs==6.0.7",
    "factory-boy==3.3.3",
    "mypy==2.3.0",
    "psycopg2-binary==2.9.12",
    "ruff==0.16.1",
]

[project.urls]
Homepage = "https://github.com/bmcivor/django-tipping"
Repository = "https://github.com/bmcivor/django-tipping"
Issues = "https://github.com/bmcivor/django-tipping/issues"

[project.scripts]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "python-semantic-release==9.21.1",
    "pytest-django==4.12.0",
    "types-psycopg2==2.9.21.20260724",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["../frontend/package.json:version"]
tag_format = "v{version}"
build_command = "uv lock --no-cache --no-progress"
# Relative to the git root, unlike version_toml / version_variables above,
# which resolve from the working directory.
assets = ["backend/uv.lock"]

[tool.semantic_release.branches.main]
match = "tag-release"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tipping.settings"
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tipping.settings"
