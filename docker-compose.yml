services:

  backend:
    build:
     context: ./backend
     target: production
    volumes:
     - ./backend:/app
    networks:
     - tipping-network
    ports:
     - 8000:8000
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: django
      POSTGRES_PASSWORD: django
      POSTGRES_DB: django-tipping
    volumes:
      - db-data:/var/lib/postgresql/
    networks:
     - tipping-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "django", "-d", "django-tipping"]
      interval: 2s
      timeout: 5s
      retries: 30

  mail:
    image: axllent/mailpit:v1.28
    networks:
     - tipping-network
    ports:
     - 8025:8025

  migrate:
    build:
      context: ./backend
      target: production
    command: ["python", "manage.py", "migrate"]
    depends_on:
      db:
        condition: service_healthy
    networks:
     - tipping-network

  frontend:
    build:
      context: ./frontend
      target: base
    volumes:
     - ./frontend:/app
     - /app/node_modules
    networks:
     - tipping-network
    ports:
     - 5173:5173
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

  # Profiled services are excluded from a plain `docker compose up`.
  # `docker compose run <service>` enables a service's own profiles, so the
  # scripts in scripts/ reach these without naming a profile.

  backend-test:
    profiles: ["test"]
    build:
     context: ./backend
     target: test
    networks:
     - tipping-network
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend-test:
    profiles: ["test"]
    build:
      context: ./frontend
      target: test
    networks:
     - tipping-network

  docs:
    profiles: ["docs"]
    image: squidfunk/mkdocs-material:9.7.1
    # The whole repository, because mkdocs.yml sits beside docs/ at the root.
    # Read-only: serving must never write into the source tree.
    volumes:
     - .:/docs:ro
    ports:
     - 8001:8001
    command: serve -a 0.0.0.0:8001

  release:
    profiles: ["release"]
    build:
      context: ./backend
      target: release
    # The whole repository, because semantic-release needs the git history and
    # writes tags — .git lives at the root, while pyproject.toml is in backend/.
    volumes:
     - .:/repo
    working_dir: /repo/backend

volumes:
  db-data:
    driver: local

networks:
  tipping-network: {}
